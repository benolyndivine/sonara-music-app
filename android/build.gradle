buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Redirect build outputs outside of OneDrive to eliminate Windows/OneDrive file locking locks
    def externalBuildDir = new File(System.getProperty("user.home"), ".gradle-builds/${rootProject.name}")
    def relativePath = project.path == ':' ? 'root' : project.path.replace(':', '/')
    layout.buildDirectory.set(new File(externalBuildDir, relativePath))
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
